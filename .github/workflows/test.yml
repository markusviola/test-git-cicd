name: Test

on:
  workflow_call:
    inputs:
      target_env:
        required: true
        type: string
      run_build:
        required: true
        type: boolean

jobs:
  test:
    environment: ${{ inputs.target_env }}
    runs-on: ubuntu-22.04

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_ROOT_PASSWORD: root
      DB_DATABASE: unit_test
      DB_USERNAME: ccs_user
      DB_PASSWORD: randpass

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ env.DB_DATABASE }}
          MYSQL_USER: ${{ env.DB_USERNAME }}
          MYSQL_PASSWORD: ${{ env.DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Download base artifact
        uses: actions/download-artifact@v4
        with:
          name: ccs-web-base

      - name: List base artifact structure
        run: ls -la .

      - name: Run PHP 8.4 engine
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: pdo, pdo_mysql, json, mbstring, bcmath, tokenizer, ctype, xml 
          coverage: none

      - name: Build .env.testing file
        run: |
          cp .env.example .env.testing
          echo "APP_ENV=${{ env.APP_ENV }}" >> .env.testing
          echo "DB_CONNECTION=${{ env.DB_CONNECTION }}" >> .env.testing
          echo "DB_HOST=${{ env.DB_HOST }}" >> .env.testing
          echo "DB_PORT=${{ env.DB_PORT }}" >> .env.testing
          echo "DB_DATABASE=${{ env.DB_DATABASE }}" >> .env.testing
          echo "DB_USERNAME=${{ env.DB_USERNAME }}" >> .env.testing
          echo "DB_PASSWORD=${{ env.DB_PASSWORD }}" >> .env.testing

      - name: Generate application key
        run: php artisan key:generate --env=testing

      - name: Migrate & seed database
        run: php artisan migrate:fresh --env=testing --seed

      - name: Run PHPUnit
        run: php artisan test --env=testing

  build:
    if: inputs.run_build == true
    needs: test
    uses: ./.github/workflows/build.yml
    with:
      target_env: ${{ inputs.target_env }}
    secrets: inherit