name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-22.04

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_ROOT_PASSWORD: root
      DB_DATABASE: unit_test
      DB_USERNAME: ccs_user
      DB_PASSWORD: randpass

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ env.DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ env.DB_DATABASE }}
          MYSQL_USER: ${{ env.DB_USERNAME }}
          MYSQL_PASSWORD: ${{ env.DB_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Pull source artifact
        uses: actions/checkout@v4

      - name: Run PHP 8.4 engine
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: pdo, pdo_mysql, json, mbstring, bcmath, tokenizer, ctype, xml 
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run NodeJS 22.x engine
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NodeJS dependencies
        run: npm ci

      - name: Build .env.testing file
        run: |
          cp .env.example .env.testing
          echo "APP_ENV=${{ env.APP_ENV }}" >> .env.testing
          echo "DB_CONNECTION=${{ env.DB_CONNECTION }}" >> .env.testing
          echo "DB_HOST=${{ env.DB_HOST }}" >> .env.testing
          echo "DB_PORT=${{ env.DB_PORT }}" >> .env.testing
          echo "DB_DATABASE=${{ env.DB_DATABASE }}" >> .env.testing
          echo "DB_USERNAME=${{ env.DB_USERNAME }}" >> .env.testing
          echo "DB_PASSWORD=${{ env.DB_PASSWORD }}" >> .env.testing

      - name: Generate application key
        run: php artisan key:generate --env=testing

      - name: Migrate & seed database
        run: php artisan migrate:fresh --env=testing --seed

      - name: Run PHPUnit
        run: php artisan test --env=testing

      - name: Build React assets
        run: npm run build

      - name: Package deployment artifact
        run: |
          mkdir -p package
          rsync -av --exclude=".git" \
                    --exclude="node_modules" \
                    --exclude="tests" \
                    --exclude=".github" \
                    ./ package/

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccs-web
          path: package

      # - name: Create production environment variables
